global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9464"]
        labels:
          service: sentinel-control-plane