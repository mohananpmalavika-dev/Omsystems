groups:
  - name: sentinel-control-plane-performance
    rules:
      - alert: ControlPlaneDown
        expr: up{job="control-plane"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Control plane metrics endpoint is unavailable
          description: Prometheus cannot scrape the control plane OpenTelemetry exporter.

      - alert: ControlPlaneHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="control-plane"}[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Control plane P95 latency is above one second
          description: The rolling five-minute HTTP P95 latency has exceeded one second.

      - alert: ControlPlaneCriticalP99Latency
        expr: histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="control-plane"}[5m]))) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Control plane P99 latency is above two seconds
          description: The rolling five-minute HTTP P99 latency needs immediate investigation.

      - alert: ControlPlaneHighErrorRate
        expr: sum(rate(http_server_request_duration_seconds_count{job="control-plane",http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count{job="control-plane"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Control plane server error rate is above five percent
          description: The rolling five-minute HTTP 5xx rate has exceeded the service threshold.

      - alert: ControlPlaneDatabaseHighP95
        expr: histogram_quantile(0.95, sum by (le) (rate(db_client_operation_duration_seconds_bucket{job="control-plane"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Database P95 query latency is above 500ms
          description: The rolling five-minute database operation P95 latency is elevated.