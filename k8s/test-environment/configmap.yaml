apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: vms-test
data:
  # Environment configuration
  NODE_ENV: "test"
  LOG_LEVEL: "info"
  
  # Database configuration
  DB_HOST: "postgres.vms-test.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "vms_test"
  DB_POOL_MIN: "10"
  DB_POOL_MAX: "100"
  
  # Redis configuration
  REDIS_HOST: "redis.vms-test.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # API configuration
  API_PORT: "3000"
  API_RATE_LIMIT: "1000"
  API_TIMEOUT: "30000"
  
  # WebSocket configuration
  WS_MAX_CONNECTIONS: "5000"
  WS_HEARTBEAT_INTERVAL: "30000"
  
  # Video streaming configuration
  MAX_CONCURRENT_STREAMS: "500"
  STREAM_BUFFER_SIZE: "2097152"
  HLS_SEGMENT_DURATION: "6"
  
  # Analytics configuration
  ANALYTICS_ENABLED: "true"
  ANALYTICS_BATCH_SIZE: "100"
  ANALYTICS_QUEUE_SIZE: "10000"
  
  # Monitoring configuration
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  HEALTH_CHECK_INTERVAL: "30000"
  
  # Feature flags
  ENABLE_BRANCH_PAGINATION: "true"
  ENABLE_SSE_UPDATES: "true"
  ENABLE_RETENTION_VERIFICATION: "true"
