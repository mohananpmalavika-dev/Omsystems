version: "3.8"

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel_grid
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SentinelSecurePass2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_admin -d sentinel_grid"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Redis Cache & Distributed Event Bus
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-SentinelRedisSecret2026!}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-SentinelRedisSecret2026!}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Fastify Control Plane API
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-control-plane
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://sentinel_admin:${DB_PASSWORD:-SentinelSecurePass2026!}@postgres:5432/sentinel_grid
      REDIS_URL: redis://:${REDIS_PASSWORD:-SentinelRedisSecret2026!}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-20a6e9a7e6b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4}
      SESSION_SECRET: ${SESSION_SECRET:-30b7f0b8f7c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5}
      MEDIA_GATEWAY_SHARED_KEY: ${MEDIA_GATEWAY_SHARED_KEY:-media-gateway-shared-key-2026}
      RECORDING_ENGINE_SHARED_KEY: ${RECORDING_ENGINE_SHARED_KEY:-recording-engine-shared-key-2026}
      ANALYTICS_ENGINE_URL: http://analytics-engine:8092
      ANALYTICS_ENGINE_SHARED_KEY: ${ANALYTICS_ENGINE_SHARED_KEY:-analytics-engine-shared-key-2026}
      ANALYTICS_SOURCE_SHARED_KEY: ${ANALYTICS_SOURCE_SHARED_KEY:-analytics-source-shared-key-2026}
      REPORT_DOWNLOAD_SECRET: ${REPORT_DOWNLOAD_SECRET:-report-download-secret-2026}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # 4. Next.js Dashboard UI
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: sentinel-dashboard
    environment:
      NODE_ENV: production
      PORT: 10000
      CONTROL_PLANE_URL: http://control-plane:8080
      CONTROL_PLANE_INTERNAL_URL: http://control-plane:8080
      MEDIA_GATEWAY_INTERNAL_URL: http://media-gateway:8090
      NEXT_PUBLIC_APP_NAME: Sentinel Grid
    ports:
      - "10000:10000"
    depends_on:
      - control-plane
    restart: always

  # 5. Media Gateway (Live RTSP & HLS Streaming)
  media-gateway:
    build:
      context: .
      dockerfile: media-gateway/Dockerfile
    container_name: sentinel-media-gateway
    environment:
      PORT: 8090
      CONTROL_PLANE_URL: http://control-plane:8080
      MEDIA_GATEWAY_SHARED_KEY: ${MEDIA_GATEWAY_SHARED_KEY:-media-gateway-shared-key-2026}
      MEDIAMTX_API_URL: http://127.0.0.1:9997
      MEDIAMTX_HLS_URL: http://127.0.0.1:8888
    ports:
      - "8090:8090"
      - "8888:8888"
      - "8554:8554"
    depends_on:
      - control-plane
    restart: always

  # 6. Recording Engine
  recording-engine:
    build:
      context: .
      dockerfile: recording-engine/Dockerfile
    container_name: sentinel-recording-engine
    environment:
      PORT: 8091
      CONTROL_PLANE_URL: http://control-plane:8080
      RECORDING_ENGINE_SHARED_KEY: ${RECORDING_ENGINE_SHARED_KEY:-recording-engine-shared-key-2026}
      RECORDING_ROOT: /recordings
    volumes:
      - recordings_data:/recordings
    ports:
      - "8091:8091"
    depends_on:
      - control-plane
    restart: always

  # 7. Analytics Engine (AI & Alert Processing)
  analytics-engine:
    build:
      context: .
      dockerfile: analytics-engine/Dockerfile
    container_name: sentinel-analytics-engine
    environment:
      NODE_ENV: production
      PORT: 8092
      CONTROL_PLANE_URL: http://control-plane:8080
      ANALYTICS_ENGINE_SHARED_KEY: ${ANALYTICS_ENGINE_SHARED_KEY:-analytics-engine-shared-key-2026}
      ANALYTICS_SOURCE_SHARED_KEY: ${ANALYTICS_SOURCE_SHARED_KEY:-analytics-source-shared-key-2026}
      ANALYTICS_REQUIRE_MODELS: "true"
    ports:
      - "8092:8092"
    depends_on:
      - control-plane
    restart: always

volumes:
  postgres_data:
  redis_data:
  recordings_data:
