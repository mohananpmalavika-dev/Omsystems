services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel_grid
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_admin -d sentinel_grid"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Redis Cache & Distributed Event Bus
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Fastify Control Plane API
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-control-plane
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      AUTH_MODE: session
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (URL-encode credentials)}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required (URL-encode credentials)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      MEDIA_GATEWAY_INTERNAL_URL: http://media-gateway:8090
      MEDIA_GATEWAY_SHARED_KEY: ${MEDIA_GATEWAY_SHARED_KEY:?MEDIA_GATEWAY_SHARED_KEY is required}
      EDGE_BRIDGE_SHARED_KEY: ${EDGE_BRIDGE_SHARED_KEY:?EDGE_BRIDGE_SHARED_KEY is required}
      RECORDING_ENGINE_URL: http://recording-engine:8091
      RECORDING_ENGINE_SHARED_KEY: ${RECORDING_ENGINE_SHARED_KEY:?RECORDING_ENGINE_SHARED_KEY is required}
      ANALYTICS_ENGINE_URL: http://analytics-engine:8092
      ANALYTICS_ENGINE_SHARED_KEY: ${ANALYTICS_ENGINE_SHARED_KEY:?ANALYTICS_ENGINE_SHARED_KEY is required}
      ANALYTICS_SOURCE_SHARED_KEY: ${ANALYTICS_SOURCE_SHARED_KEY:?ANALYTICS_SOURCE_SHARED_KEY is required}
      REPORT_DOWNLOAD_SECRET: ${REPORT_DOWNLOAD_SECRET:?REPORT_DOWNLOAD_SECRET is required}
      FEDERATION_LOCAL_PUBLIC_URL: ${FEDERATION_LOCAL_PUBLIC_URL:?FEDERATION_LOCAL_PUBLIC_URL is required}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # 4. Next.js Dashboard UI
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: sentinel-dashboard
    environment:
      NODE_ENV: production
      PORT: 10000
      CONTROL_PLANE_URL: http://control-plane:8080
      CONTROL_PLANE_INTERNAL_URL: http://control-plane:8080
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:?PUBLIC_DASHBOARD_URL is required}
      MEDIA_GATEWAY_INTERNAL_URL: http://media-gateway:8090
      RECORDING_ENGINE_INTERNAL_URL: http://recording-engine:8091
      RECORDING_ENGINE_SHARED_KEY: ${RECORDING_ENGINE_SHARED_KEY:?RECORDING_ENGINE_SHARED_KEY is required}
      EDGE_BRIDGE_SHARED_KEY: ${EDGE_BRIDGE_SHARED_KEY:?EDGE_BRIDGE_SHARED_KEY is required}
      NEXT_PUBLIC_APP_NAME: Sentinel Grid
    ports:
      - "10000:10000"
    depends_on:
      - control-plane
    restart: always

  # 5. Media Gateway (Live RTSP & HLS Streaming)
  media-gateway:
    build:
      context: .
      dockerfile: media-gateway/Dockerfile
    container_name: sentinel-media-gateway
    environment:
      NODE_ENV: production
      PORT: 8090
      CONTROL_PLANE_URL: http://control-plane:8080
      MEDIA_GATEWAY_SHARED_KEY: ${MEDIA_GATEWAY_SHARED_KEY:?MEDIA_GATEWAY_SHARED_KEY is required}
      EDGE_BRIDGE_SHARED_KEY: ${EDGE_BRIDGE_SHARED_KEY:?EDGE_BRIDGE_SHARED_KEY is required}
      MEDIAMTX_API_URL: http://127.0.0.1:9997
      MEDIAMTX_HLS_URL: http://127.0.0.1:8888
      MEDIAMTX_WEBRTC_URL: http://127.0.0.1:8889
      PUBLIC_HLS_BASE_URL: ${PUBLIC_HLS_BASE_URL:?PUBLIC_HLS_BASE_URL is required (gateway /hls URL)}
      PUBLIC_WEBRTC_BASE_URL: ${PUBLIC_WEBRTC_BASE_URL:?PUBLIC_WEBRTC_BASE_URL is required (gateway /webrtc URL)}
      STREAM_SECRETS_JSON: ${STREAM_SECRETS_JSON:?STREAM_SECRETS_JSON is required}
    ports:
      - "8090:8090"
      - "8189:8189/udp"
    depends_on:
      - control-plane
    restart: always

  # 6. Recording Engine
  recording-engine:
    build:
      context: .
      dockerfile: recording-engine/Dockerfile
    container_name: sentinel-recording-engine
    environment:
      NODE_ENV: production
      PORT: 8091
      CONTROL_PLANE_URL: http://control-plane:8080
      RECORDING_ENGINE_SHARED_KEY: ${RECORDING_ENGINE_SHARED_KEY:?RECORDING_ENGINE_SHARED_KEY is required}
      STREAM_SECRETS_JSON: ${STREAM_SECRETS_JSON:?STREAM_SECRETS_JSON is required}
      RECORDING_ROOT: /recordings
      STORAGE_ALERT_SMTP_URL: ${STORAGE_ALERT_SMTP_URL:-}
      STORAGE_ALERT_EMAIL_FROM: ${STORAGE_ALERT_EMAIL_FROM:-}
    volumes:
      - recordings_data:/recordings
    ports:
      - "8091:8091"
    depends_on:
      - control-plane
    restart: always

  # 7. Analytics Engine (AI & Alert Processing)
  analytics-engine:
    build:
      context: .
      dockerfile: analytics-engine/Dockerfile
    container_name: sentinel-analytics-engine
    environment:
      NODE_ENV: production
      PORT: 8092
      CONTROL_PLANE_URL: http://control-plane:8080
      ANALYTICS_ENGINE_SHARED_KEY: ${ANALYTICS_ENGINE_SHARED_KEY:?ANALYTICS_ENGINE_SHARED_KEY is required}
      ANALYTICS_SOURCE_SHARED_KEY: ${ANALYTICS_SOURCE_SHARED_KEY:?ANALYTICS_SOURCE_SHARED_KEY is required}
      ANALYTICS_REQUIRE_MODELS: "true"
    ports:
      - "8092:8092"
    depends_on:
      - control-plane
    restart: always

volumes:
  postgres_data:
  redis_data:
  recordings_data:
