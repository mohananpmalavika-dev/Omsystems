version: '3.8'

# ======================================
# Multi-Server Setup with Redis Pub/Sub
# ======================================
# Test horizontal scaling locally
# Usage: docker-compose -f docker-compose.distributed.yml up

services:
  # Redis for distributed event bus
  redis:
    image: redis:7-alpine
    container_name: oms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: oms-postgres
    environment:
      POSTGRES_DB: sentinel_grid
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Control Plane Server 1
  control-plane-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oms-control-plane-1
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      
      # Distributed Events
      DISTRIBUTED_EVENTS: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: 0
      EVENT_BUS_NAMESPACE: oms
      SERVER_ID: control-plane-1
      
      # Server Config
      PORT: 3000
      NODE_ENV: development
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Control Plane Server 2
  control-plane-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oms-control-plane-2
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      
      # Distributed Events
      DISTRIBUTED_EVENTS: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: 0
      EVENT_BUS_NAMESPACE: oms
      SERVER_ID: control-plane-2
      
      # Server Config
      PORT: 3000
      NODE_ENV: development
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "3001:3000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Control Plane Server 3
  control-plane-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oms-control-plane-3
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      
      # Distributed Events
      DISTRIBUTED_EVENTS: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: 0
      EVENT_BUS_NAMESPACE: oms
      SERVER_ID: control-plane-3
      
      # Server Config
      PORT: 3000
      NODE_ENV: development
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "3002:3000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: oms-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - control-plane-1
      - control-plane-2
      - control-plane-3
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
