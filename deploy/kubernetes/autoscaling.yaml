apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: control-plane }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: control-plane }
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleUp: { stabilizationWindowSeconds: 30, policies: [{ type: Percent, value: 100, periodSeconds: 60 }, { type: Pods, value: 4, periodSeconds: 60 }], selectPolicy: Max }
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Percent, value: 25, periodSeconds: 60 }] }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 75 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: control-plane }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: control-plane } }
