events {
    worker_connections 4096;
}

http {
    # Upstream servers (3 control plane instances)
    upstream control_plane {
        least_conn;  # Load balance based on least connections
        
        server control-plane-1:3000 max_fails=3 fail_timeout=30s;
        server control-plane-2:3000 max_fails=3 fail_timeout=30s;
        server control-plane-3:3000 max_fails=3 fail_timeout=30s;
    }

    # WebSocket upgrade settings
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # Increase buffer sizes for SSE
        proxy_buffering off;
        proxy_cache off;

        # Client body size limit
        client_max_body_size 100M;

        # Timeouts for long-running connections (SSE, WebSocket)
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # WebSocket and SSE support
        location / {
            proxy_pass http://control_plane;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Sticky sessions based on IP (optional, for SSE)
            # Uncomment if you want same client to hit same server
            # ip_hash;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://control_plane/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Status page
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
