<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Grid - Configuration Checker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0a1628, #1a2942);
            color: #e8eef7;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
        }
        h1 { 
            color: #4a9eff;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #8ea5c2;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .check {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .check-title {
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
        }
        .status.pending { background: #ffa726; color: #000; }
        .status.success { background: #4caf50; color: #fff; }
        .status.error { background: #f44336; color: #fff; }
        .status.checking { background: #2196f3; color: #fff; }
        .check-result {
            font-size: 13px;
            color: #b8c9e0;
            margin-top: 5px;
        }
        button {
            background: linear-gradient(135deg, #4a9eff, #3678e5);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error-detail {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            font-size: 12px;
            font-family: monospace;
            color: #ff8a80;
        }
        .success-detail {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            font-size: 12px;
            color: #a5d6a7;
        }
        .code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Sentinel Grid Configuration Checker</h1>
        <p class="subtitle">Diagnose API connection issues and verify deployment configuration</p>

        <div id="checks"></div>

        <button id="runChecks" onclick="runAllChecks()">Run Diagnostic Checks</button>
    </div>

    <script>
        const checks = [
            {
                id: 'api-base',
                title: 'API Base URL Configuration',
                test: async () => {
                    // Check what API base is being used
                    const apiBase = window.location.origin + '/api/control';
                    return {
                        success: true,
                        message: `Using: ${apiBase}`,
                        details: 'API calls should use relative paths via /api/control proxy'
                    };
                }
            },
            {
                id: 'health-check',
                title: 'Dashboard Health Check',
                test: async () => {
                    try {
                        const response = await fetch('/health', { 
                            method: 'GET',
                            cache: 'no-cache'
                        });
                        
                        if (response.ok) {
                            const data = await response.json();
                            return {
                                success: true,
                                message: 'Dashboard is healthy',
                                details: JSON.stringify(data, null, 2)
                            };
                        } else {
                            return {
                                success: false,
                                message: `Health check failed: ${response.status}`,
                                details: 'Dashboard service may not be running correctly'
                            };
                        }
                    } catch (error) {
                        return {
                            success: false,
                            message: 'Cannot reach dashboard',
                            details: error.message
                        };
                    }
                }
            },
            {
                id: 'control-plane',
                title: 'Control Plane Connection',
                test: async () => {
                    try {
                        const response = await fetch('/api/control/health', {
                            method: 'GET',
                            cache: 'no-cache'
                        });
                        
                        if (response.ok) {
                            const data = await response.json();
                            return {
                                success: true,
                                message: 'Control plane is reachable',
                                details: JSON.stringify(data, null, 2)
                            };
                        } else {
                            return {
                                success: false,
                                message: `Control plane returned: ${response.status}`,
                                details: 'Check CONTROL_PLANE_URL environment variable'
                            };
                        }
                    } catch (error) {
                        return {
                            success: false,
                            message: 'Cannot reach control plane',
                            details: error.message
                        };
                    }
                }
            },
            {
                id: 'wrong-domain',
                title: 'Check for Hardcoded Domain',
                test: async () => {
                    // Try to detect if API calls are going to wrong domain
                    const wrongDomain = 'sentinel-grid-monitoring1.onrender.com';
                    
                    try {
                        // Make a test API call and check where it goes
                        const testUrl = '/api/control/v1/auth/me';
                        const response = await fetch(testUrl, {
                            method: 'GET',
                            cache: 'no-cache'
                        });
                        
                        // Check if it's trying to redirect or hitting wrong domain
                        const finalUrl = response.url;
                        
                        if (finalUrl.includes(wrongDomain)) {
                            return {
                                success: false,
                                message: `API calls are going to wrong domain: ${wrongDomain}`,
                                details: 'Set NEXT_PUBLIC_API_BASE=/api/control in Render environment variables'
                            };
                        } else {
                            return {
                                success: true,
                                message: 'API calls are using correct path',
                                details: `Requests going to: ${finalUrl}`
                            };
                        }
                    } catch (error) {
                        return {
                            success: false,
                            message: 'Could not test API path',
                            details: error.message
                        };
                    }
                }
            }
        ];

        function createCheckElement(check) {
            const div = document.createElement('div');
            div.className = 'check';
            div.id = `check-${check.id}`;
            div.innerHTML = `
                <div class="check-title">
                    ${check.title}
                    <span class="status pending" id="status-${check.id}">PENDING</span>
                </div>
                <div class="check-result" id="result-${check.id}">
                    Click "Run Diagnostic Checks" to begin
                </div>
            `;
            return div;
        }

        function updateCheck(checkId, status, message, details) {
            const statusEl = document.getElementById(`status-${checkId}`);
            const resultEl = document.getElementById(`result-${checkId}`);
            
            statusEl.className = `status ${status}`;
            statusEl.textContent = status.toUpperCase();
            
            let html = message;
            if (details) {
                const detailClass = status === 'success' ? 'success-detail' : 'error-detail';
                html += `<div class="${detailClass}">${details}</div>`;
            }
            resultEl.innerHTML = html;
        }

        async function runAllChecks() {
            const button = document.getElementById('runChecks');
            button.disabled = true;
            button.textContent = 'Running checks...';

            for (const check of checks) {
                updateCheck(check.id, 'checking', 'Testing...', null);
                
                try {
                    const result = await check.test();
                    updateCheck(
                        check.id,
                        result.success ? 'success' : 'error',
                        result.message,
                        result.details
                    );
                } catch (error) {
                    updateCheck(
                        check.id,
                        'error',
                        'Test failed',
                        error.message
                    );
                }

                // Small delay between checks
                await new Promise(resolve => setTimeout(resolve, 500));
            }

            button.disabled = false;
            button.textContent = 'Run Checks Again';
        }

        // Initialize
        const container = document.getElementById('checks');
        checks.forEach(check => {
            container.appendChild(createCheckElement(check));
        });
    </script>
</body>
</html>
