# Isolated test dependencies. Never point destructive integration tests at production.
name: sentinel-vms-qa
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: sentinel_test
      POSTGRES_USER: vms_qa
      POSTGRES_PASSWORD: ${VMS_QA_POSTGRES_PASSWORD:?Generate a test-only password first}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms_qa -d sentinel_test"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
