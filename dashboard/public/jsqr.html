<!DOCTYPE html>
<html>
<head>
  <title>jsQR Library Loader</title>
</head>
<body>
  <!-- Load jsQR from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    // Make jsQR available globally
    if (typeof jsQR !== 'undefined') {
      window.jsQR = jsQR;
      console.log('jsQR library loaded successfully');
    }
  </script>
</body>
</html>
