logLevel: info

api: yes
apiAddress: :9997

authMethod: http
authHTTPAddress: http://127.0.0.1:8090/internal/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

hls: yes
hlsAddress: :8888
# Low-latency buffer depth: 3 segments × 1s = ~3s total buffer
hlsVariant: fmp4
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins:
  - "*"

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAllowOrigins: ["*"]

pathDefaults:
  sourceOnDemand: yes
  # 8s is sufficient since edge-agent is always online and starts pushing quickly.
  # Reduced from 20s to cut first-connect delay by ~12 seconds.
  sourceOnDemandStartTimeout: 8s
  # Keep the RTSP connection alive for 3 minutes after the last viewer
  # leaves to avoid cold-start 500s on quick reconnect.
  sourceOnDemandCloseAfter: 180s

paths: {}

