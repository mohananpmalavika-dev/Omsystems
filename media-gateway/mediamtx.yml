logLevel: info

api: yes
apiAddress: :9997

authMethod: http
authHTTPAddress: http://127.0.0.1:8090/internal/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

hls: yes
hlsAddress: :8888
# Standard HLS (MPEG-TS) is more reliable through Cloudflare tunnels than
# LL-HLS (which requires sub-second round trips not achievable via Cloudflare).
hlsVariant: mpegts
# Buffer depth: 8 segments × 3s = 24s total — enough to absorb Cloudflare
# tunnel latency (200–400ms) and client-side player prefetch delays without
# segments expiring before they can be fetched.
hlsSegmentCount: 8
hlsSegmentDuration: 3s
hlsPartDuration: 500ms
hlsAllowOrigins:
  - "*"

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAllowOrigins: ["*"]

pathDefaults:
  sourceOnDemand: yes
  # Increased from 15s: gives the RTSP source time to connect, authenticate,
  # and buffer enough segments for the m3u8 to be valid before clients poll.
  sourceOnDemandStartTimeout: 20s
  # Keep the RTSP connection alive for 3 minutes after the last viewer
  # leaves to avoid cold-start 500s on quick reconnect.
  sourceOnDemandCloseAfter: 180s
  
  # Audio transcoding for browser HLS compatibility
  # Cameras often send G.711 (PCMU/PCMA) which browsers cannot play
  # This FFmpeg hook transcodes audio to AAC for browser playback while keeping video as-is
  runOnReady: ffmpeg -fflags nobuffer -flags low_delay -rtsp_transport tcp -i rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH -c:v copy -c:a aac -b:a 128k -ar 48000 -ac 2 -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
  runOnReadyRestart: yes

paths: {}

