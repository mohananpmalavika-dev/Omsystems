apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-engine
  namespace: sentinel-analytics
  labels:
    app: analytics-engine

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: analytics-engine-role
  namespace: sentinel-analytics
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: analytics-engine-rolebinding
  namespace: sentinel-analytics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: analytics-engine-role
subjects:
  - kind: ServiceAccount
    name: analytics-engine
    namespace: sentinel-analytics
