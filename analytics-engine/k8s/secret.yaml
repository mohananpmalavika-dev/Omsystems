# Create secrets with:
# kubectl create secret generic analytics-engine-secrets \
#   --from-literal=ANALYTICS_ENGINE_SHARED_KEY=your-engine-key \
#   --from-literal=ANALYTICS_SOURCE_SHARED_KEY=your-source-key \
#   --from-literal=DATABASE_URL=postgresql://user:password@host:5432/db \
#   -n sentinel-analytics

apiVersion: v1
kind: Secret
metadata:
  name: analytics-engine-secrets
  namespace: sentinel-analytics
  labels:
    app: analytics-engine
type: Opaque
stringData:
  # REQUIRED: Update these values before deploying
  ANALYTICS_ENGINE_SHARED_KEY: "CHANGE_ME_your-engine-key-min-32-characters"
  ANALYTICS_SOURCE_SHARED_KEY: "CHANGE_ME_your-source-key-min-32-characters"
  DATABASE_URL: "postgresql://analytics:CHANGE_ME@postgres:5432/sentinel_analytics"
  REDIS_PASSWORD: "CHANGE_ME_redis-password"
  INCIDENT_API_KEY: "CHANGE_ME_incident-api-key"
  WEBHOOK_SECRET: "CHANGE_ME_webhook-secret"
