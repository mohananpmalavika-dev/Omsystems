services:
  # Analytics Engine API Service
  - type: web
    name: sentinel-analytics-engine
    runtime: node
    region: oregon
    plan: starter # or standard/pro based on your needs
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ANALYTICS_REQUIRE_MODELS
        value: false # Set to true if models are required
      - key: ENABLE_GPU_ACCELERATION
        value: false # Enable if using GPU-enabled plan
      - key: MODEL_CACHE_SIZE_MB
        value: 2048
      - key: ANALYTICS_FRAME_WIDTH
        value: 640
      - key: ANALYTICS_FRAME_HEIGHT
        value: 640
      - key: ANALYTICS_FRAME_TIMEOUT_MS
        value: 10000
      
      # Analog Camera AI Features
      - key: ENABLE_ANALOG_VIDEO_QUALITY
        value: true
      - key: ENABLE_CAMERA_AGING_PREDICTION
        value: true
      - key: ENABLE_CAMERA_TYPE_CLASSIFIER
        value: true
      - key: ENABLE_DVR_CHANNEL_HEALTH
        value: true
      
      # Quality Thresholds
      - key: ANALOG_NOISE_THRESHOLD_LOW
        value: 15
      - key: ANALOG_NOISE_THRESHOLD_HIGH
        value: 30
      - key: ANALOG_SHARPNESS_THRESHOLD
        value: 20
      
      # Aging Thresholds
      - key: CAMERA_HIGH_RISK_AGE_YEARS
        value: 7
      - key: CAMERA_CRITICAL_RISK_AGE_YEARS
        value: 10
      - key: CAMERA_DEGRADATION_THRESHOLD
        value: 5
      
      # Confidence Thresholds
      - key: HELMET_CONFIDENCE_THRESHOLD
        value: 0.7
      - key: FIRE_CONFIDENCE_THRESHOLD
        value: 0.65
      - key: FACE_CONFIDENCE_THRESHOLD
        value: 0.75
      - key: ANPR_PLATE_CONFIDENCE_THRESHOLD
        value: 0.7
      - key: ANPR_CONFIDENCE_THRESHOLD
        value: 0.8
      - key: ANPR_COUNTRY_CODE
        value: IN
      
      # Security Keys (Use Render's secret management)
      - key: ANALYTICS_SOURCE_SHARED_KEY
        generateValue: true # Auto-generate on first deploy
      - key: CONTROL_PLANE_SHARED_KEY
        sync: false # Set manually in Render dashboard
      
      # Optional: Control Plane URL
      - key: CONTROL_PLANE_URL
        value: https://your-control-plane.onrender.com
      
      # FFmpeg Path (usually auto-detected)
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      
      # Model Directory
      - key: MODELS_DIR
        value: /opt/render/project/src/analytics-engine/models
    
    # Health check configuration
    healthCheckPath: /health
    
    # Autoscaling (optional, requires higher plan)
    # autoDeploy: true
    # numInstances: 1
    # scaling:
    #   minInstances: 1
    #   maxInstances: 3
    #   targetMemoryPercent: 80
    #   targetCPUPercent: 80
    
    # Disk storage for models (optional)
    disk:
      name: analytics-models
      mountPath: /opt/render/project/src/analytics-engine/models
      sizeGB: 10

  # Optional: Background worker for stream processing
  # - type: worker
  #   name: sentinel-stream-processor
