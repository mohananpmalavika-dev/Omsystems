# Render Blueprint for Sentinel Grid Deployment
# This file defines all services needed for deployment

services:
  # Dashboard Service (Next.js Frontend)
  - type: web
    name: sentinel-grid-dashboard
    runtime: node
    buildCommand: npm ci --workspace @sentinel/dashboard && npm run dashboard:build
    startCommand: npm run dashboard:start
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NEXT_PUBLIC_API_BASE
        value: /api/control
      - key: CONTROL_PLANE_URL
        fromService:
          type: web
          name: sentinel-grid-control-plane
          property: host
    healthCheckPath: /health

  # Control Plane Service (Node.js Backend API)
  - type: web
    name: sentinel-grid-control-plane
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-grid-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /health

databases:
  - name: sentinel-grid-db
    databaseName: sentinel_grid
    user: sentinel_admin
