# Sentinel Grid production blueprint
#
# Every runtime is explicitly paid/always-on. Render free web services sleep
# after inactivity and are not suitable for 24/7 surveillance operations.

services:
  - type: web
    name: sentinel-grid-control-plane
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: session
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-grid-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sentinel-grid-redis
          property: connectionString
      - key: CONTROL_PLANE_PUBLIC_URL
        fromService:
          type: web
          name: sentinel-grid-control-plane
          envVarKey: RENDER_EXTERNAL_URL
      - key: RECORDING_ENGINE_URL
        fromService:
          type: pserv
          name: sentinel-grid-recording-engine
          property: hostport
      - key: ANALYTICS_ENGINE_URL
        fromService:
          type: pserv
          name: sentinel-grid-analytics-engine
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: REPORT_DOWNLOAD_SECRET
        generateValue: true
      - key: MEDIA_GATEWAY_SHARED_KEY
        generateValue: true
      - key: EDGE_LEGACY_SHARED_KEY_ENABLED
        value: "false"
      - key: EDGE_MANAGED_TUNNEL_REQUIRED
        # Keep the control plane available for VPN branches and one-time local
        # discovery even before Cloudflare credentials are configured. Set this
        # to "true" only after all four Cloudflare settings below are present.
        value: "false"
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_ZONE_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: EDGE_MEDIA_BASE_DOMAIN
        sync: false
      - key: EDGE_UPDATE_SIGNING_PRIVATE_KEY
        sync: false
      - key: RECORDING_ENGINE_SHARED_KEY
        generateValue: true
      - key: ANALYTICS_ENGINE_SHARED_KEY
        generateValue: true
      - key: ANALYTICS_SOURCE_SHARED_KEY
        generateValue: true

  - type: web
    name: sentinel-grid-dashboard
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_BASE
        value: /api/control
      - key: CONTROL_PLANE_INTERNAL_URL
        fromService:
          type: web
          name: sentinel-grid-control-plane
          property: hostport
      - key: CONTROL_PLANE_PUBLIC_URL
        fromService:
          type: web
          name: sentinel-grid-control-plane
          envVarKey: RENDER_EXTERNAL_URL
      - key: MEDIA_GATEWAY_INTERNAL_URL
        fromService:
          type: web
          name: sentinel-grid-media-gateway
          property: hostport
      # Optional branch-local/VPN gateway. The dashboard selects this on
      # reachable HTTP pages and falls back to the public HTTPS gateway.
      - key: MEDIA_GATEWAY_LOCAL_URL
        sync: false
      # Optional public HTTPS tunnel for browsers outside the branch VPN.
      - key: MEDIA_GATEWAY_PUBLIC_URL
        value: https://apnic-deserve-evans-yarn.trycloudflare.com
      # Optional JSON map for branch-specific tunnels, keyed by local gateway
      # origin, for example {"http://branch-a-gateway.internal:8090":"https://branch-a.example.com"}.
      - key: MEDIA_GATEWAY_PUBLIC_URLS
        sync: false
      - key: RECORDING_ENGINE_INTERNAL_URL
        fromService:
          type: pserv
          name: sentinel-grid-recording-engine
          property: hostport
      - key: RECORDING_ENGINE_SHARED_KEY
        fromService:
          type: web
          name: sentinel-grid-control-plane
          envVarKey: RECORDING_ENGINE_SHARED_KEY

  - type: web
    name: sentinel-grid-media-gateway
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./media-gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8090
      - key: CONTROL_PLANE_URL
        fromService:
          type: web
          name: sentinel-grid-control-plane
          property: hostport
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: sentinel-grid-media-gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: MEDIA_GATEWAY_SHARED_KEY
        fromService:
          type: web
          name: sentinel-grid-control-plane
          envVarKey: MEDIA_GATEWAY_SHARED_KEY
      - key: MEDIAMTX_API_URL
        value: http://127.0.0.1:9997
      - key: MEDIAMTX_HLS_URL
        value: http://127.0.0.1:8888
      - key: STREAM_SECRETS_JSON
        value: "{}"

  - type: pserv
    name: sentinel-grid-recording-engine
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./recording-engine/Dockerfile
    dockerContext: .
    disk:
      name: recording-event-cache
      mountPath: /recordings
      sizeGB: 100
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8091
      - key: CONTROL_PLANE_URL
        fromService:
          type: web
          name: sentinel-grid-control-plane
          property: hostport
      - key: RECORDING_ENGINE_SHARED_KEY
        fromService:
          type: web
          name: sentinel-grid-control-plane
          envVarKey: RECORDING_ENGINE_SHARED_KEY
      - key: RECORDING_ROOT
        value: /recordings
      - key: STORAGE_NODE_EXTERNAL_ID
        value: render-event-cache-01
      - key: STORAGE_NODE_NAME
        value: Cloud event recording cache
      - key: STORAGE_NODE_TIERS
        value: hot,warm,cold
      - key: RETENTION_SWEEP_SECONDS
        value: 300
      - key: MIN_FREE_STORAGE_BYTES
        value: 5368709120
      - key: STREAM_SECRETS_JSON
        value: "{}"
      - key: EVIDENCE_ARCHIVE_REQUIRED
        value: "true"
      - key: EVIDENCE_S3_BUCKET
        sync: false
      - key: EVIDENCE_S3_REGION
        value: ap-south-1
      - key: EVIDENCE_S3_ACCESS_KEY_ID
        sync: false
      - key: EVIDENCE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: EVIDENCE_S3_ENCRYPTION
        value: AES256

  - type: pserv
    name: sentinel-grid-analytics-engine
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./analytics-engine/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8092
      - key: CONTROL_PLANE_URL
        fromService:
          type: web
          name: sentinel-grid-control-plane
          property: hostport
      - key: ANALYTICS_ENGINE_SHARED_KEY
        fromService:
          type: web
          name: sentinel-grid-control-plane
          envVarKey: ANALYTICS_ENGINE_SHARED_KEY
      - key: ANALYTICS_SOURCE_SHARED_KEY
        fromService:
          type: web
          name: sentinel-grid-control-plane
          envVarKey: ANALYTICS_SOURCE_SHARED_KEY
      - key: ANALYTICS_REQUIRE_MODELS
        value: "false"
      - key: LOG_TO_FILE
        value: "false"

  - type: redis
    name: sentinel-grid-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: noeviction

databases:
  - name: sentinel-grid-db
    databaseName: sentinel_grid
    user: sentinel_admin
    plan: basic-1gb
    region: singapore
    diskSizeGB: 100
    storageAutoscalingEnabled: true
